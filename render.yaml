# Render blueprint — point Render at this repo and it reads this file.
#
# EU region (Frankfurt) is deliberate: founders are students at a Finnish
# university writing private reflections, so the data stays in the EU.
#
# The disk is what makes SQLite viable here. Without it the database lives on
# the container filesystem and every deploy silently wipes every account,
# conversation and check-in.
services:
  - type: web
    name: sprint-buddy
    runtime: docker
    region: frankfurt
    plan: starter
    # Returns 200 with {"user": null} when signed out, so it needs no auth.
    healthCheckPath: /api/health
    disk:
      name: sprint-buddy-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # Set in the Render dashboard, never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The address the cohort actually uses. Declared here rather than left to
      # the dashboard, which is what `sync: false` meant and is the wrong
      # setting for it: this is a public URL, not a secret, and the only thing
      # dashboard-only bought was the chance of it being unset.
      #
      # It matters more than it reads. Invite and password-reset links are
      # built from this and from nothing else — they used to fall back to the
      # request's own Host header, which meant the address in an email setting
      # a founder's password was chosen by whoever sent the request. With no
      # value here the app now refuses to issue a link at all, which is the
      # safe failure but still a failure.
      #
      # Safe to change: the CSRF check accepts this host *and* whichever host
      # the browser addressed, so the onrender.com address keeps working.
      - key: PUBLIC_BASE_URL
        value: https://aaltofoundersprint.com
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /app/data/sprint-buddy.db
      - key: HOST
        value: 0.0.0.0
      # The sprint's first day. sprint-calendar.ts prefers this and derives the
      # current week from it. It was set in the dashboard but missing here, so a
      # blueprint rebuild would silently drop back to SPRINT_WEEK below and pin
      # the cohort to week 1 forever — with the dashboard reporting that nobody
      # needs attention.
      - key: SPRINT_START_DATE
        value: "2026-09-08"
      # Fallback only, used when SPRINT_START_DATE is unset.
      - key: SPRINT_WEEK
        value: "1"
      - key: ANTHROPIC_EFFORT
        value: low
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      # --- Backups: Cloudflare R2, EU jurisdiction (see docs/operations/backups.md)
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      # Encrypts the snapshot before it leaves the box. Read by the code and
      # by scripts/restore-db.ts, but it was not declared here at all — so a
      # blueprint rebuild never prompts for it, and unset, the default is to
      # ship the whole database to object storage in the clear: Argon2id
      # hashes and thirty days of the cohort's private conversations.
      #
      # Losing this key loses every backup, which is a real way to destroy the
      # data it protects. Keep it somewhere other than the same dashboard.
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      # --- Invite/reset email: Resend, EU region
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # A monitored address. The From line is a no-reply, so this is the only
      # way a founder warned about an unrequested reset can reach anyone.
      - key: RESEND_REPLY_TO
        sync: false
      # --- Error tracking (EU region)
      #
      # Unset, deliberately and currently. src/lib/errors.ts treats a missing
      # DSN as "reporting is off" and never throws, so the app runs normally
      # without it; the cost is that a founder tells you something broke before
      # any alert does.
      #
      # Setting this is not only a dashboard change. PRIVACY.md enumerates the
      # processors students are told about, and Sentry was struck from that
      # table when this was left empty — so switching it on means putting the
      # row back, with the project's real region. Choose the EU region if you
      # do: every other processor is EU, and PRIVACY.md singles out Anthropic
      # as the only transfer that leaves it.
      - key: SENTRY_DSN
        sync: false
