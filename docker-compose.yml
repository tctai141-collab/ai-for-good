services:
  web:
    build:
      context: .
      network: host
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      DB_PATH: /app/data/sprint-buddy.db
      SPRINT_WEEK: ${SPRINT_WEEK:-1}
      # Required — the advisor cannot answer without it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-low}
      # Setup links are built from this; without it they point at localhost.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    # Named volume, not a bind mount: the database must outlive the container.
    volumes:
      - sprint-buddy-data:/app/data

volumes:
  sprint-buddy-data:
