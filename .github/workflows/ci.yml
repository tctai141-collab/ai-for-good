# The gate that did not exist.
#
# Render auto-deploys from `main` in about 90 seconds with nothing in front of
# it, so before this a commit with a broken typecheck or a failing test reached
# production unchallenged — and the typecheck was red the whole time, with no
# tests to fail.
#
# For this to actually block anything, branch protection on `main` must require
# the "verify" check. That is a repository setting, not something this file can
# do on its own; see the PR description.
name: CI

# Least privilege: the job only reads the tree. Without this the default
# token is writable, so anything that runs here could push.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # The sprint the cohort is actually running, matching .env.example. Only
      # one test reads it, and that test exists to fail when the working-style
      # retake windows are left behind by a new cohort. Unset, it skipped
      # silently in CI, which is the one place the guard needed to run.
      SPRINT_START_DATE: "2026-09-08"

    steps:
      # Pinned by digest: a tag can be moved to point at new code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to the version the Dockerfile builds with, so CI cannot pass
          # on a runtime the deployment never sees.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Must come after the build: the tests run the real production output
      # against a throwaway database rather than importing modules directly,
      # because that is the only layer the authorization bugs were visible at.
      - name: Test
        run: bun test

      - name: Audit dependencies
        run: |
          # Block on high AND critical. This used to match "high:" alone, which
          # meant a critical advisory sailed through the gate reporting nothing
          # — and one duly did: the Astro AVIF RCE below sat in a passing build.
          #
          # Moderate and low are printed for visibility and do not block.
          #
          # The exceptions are listed by id rather than by lowering the bar.
          # Every one of them lives inside Astro's own dependency tree and is
          # pinned there, so none can move until Astro 7 — a major upgrade, and
          # not one to do inside an unrelated PR. Each was checked for
          # reachability in this app before being listed:
          #
          #   GHSA-rgj7-g3m4-5g8c  sharp / libheif. Reached only through image
          #     optimization. This app never imports astro:assets and has no
          #     image config; sharp is present as Astro's transitive dependency
          #     and nothing calls it.
          #   GHSA-w27v-7q3p-w38r  SVGO removeScripts. A build-time SVG
          #     optimizer. No user-supplied SVG is processed at build or at
          #     runtime; the only SVGs here are ones in this repository.
          #   GHSA-2883-xcg3-v3hh  js-yaml CPU use on merge keys. Astro parses
          #     its own config and content frontmatter with this. No founder
          #     input reaches a YAML parser anywhere in the app.
          #
          # Same tree, same blocker, and listed here rather than silently
          # tolerated: GHSA-26w7-cxv4-gfx2 (critical, AVIF RCE) is unreachable
          # for the same reason as the sharp one — no image optimization.
          #
          # REVIEW BY 2026-10-15, or when Astro 7 lands, whichever is first.
          # If this list is still here after that date it has stopped being a
          # decision and become a habit.
          ALLOWED='GHSA-rgj7-g3m4-5g8c|GHSA-w27v-7q3p-w38r|GHSA-2883-xcg3-v3hh|GHSA-26w7-cxv4-gfx2'

          bun audit > audit.txt 2>&1 || true
          cat audit.txt

          blocking=$(grep -E "^\s+(high|critical):" audit.txt | grep -vE "$ALLOWED" || true)
          if [ -n "$blocking" ]; then
            echo "$blocking"
            echo "::error::High or critical advisories found that are not on the reviewed list."
            exit 1
          fi

          # A listed advisory that has stopped appearing has been fixed, and the
          # entry should go. Said out loud, because an allowlist nobody prunes
          # is how the next real one gets waved through.
          for id in $(echo "$ALLOWED" | tr '|' ' '); do
            grep -q "$id" audit.txt || echo "::warning::$id is no longer reported and can be removed from the allowlist in ci.yml."
          done

          echo "No unreviewed high or critical advisories."
